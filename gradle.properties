# No absolute paths in this file: the Android SDK is resolved from the
# ANDROID_HOME / ANDROID_SDK_ROOT environment variables (or a local
# local.properties next to this file, which is git-ignored). The Gradle
# wrapper (gradlew) pins the Gradle version, so no local Gradle install
# is required either.
org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# R8 full mode: the most aggressive, most AOT shrinker mode. Rules that the
# app needs live in app/proguard-rules.pro; nothing here depends on machine
# or user-specific paths.
android.enableR8.fullMode=true
